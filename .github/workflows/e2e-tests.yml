name: E2E Pipeline Tests

on:
  schedule:
    # Nightly at 02:00 UTC (fast mode) and weekly Sunday at 04:00 UTC (full mode)
    - cron: "0 2 * * *"
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode: fast (e2e only) or full (e2e + llm + slow)"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - full

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # --------------------------------------------------------------------------
  # Fast mode: runs only @pytest.mark.e2e tests — no LLM calls, no slow tests.
  # Triggered nightly and on every workflow_dispatch with mode=fast.
  # --------------------------------------------------------------------------
  e2e-fast:
    name: Runtime Smoke (fast)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == '')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/bfi_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r fee_crawler/requirements.txt pytest pytest-timeout

      - name: Install system dependencies for PDF extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils

      - name: Install Modal browser runtime
        run: python -m playwright install chromium

      - name: Run fast runtime smoke tests
        env:
          # Explicitly unset R2_ENDPOINT so the R2 bypass guard passes
          R2_ENDPOINT: ""
        run: |
          pytest --timeout=120 -v --tb=short \
            fee_crawler/tests/test_executor.py \
            fee_crawler/tests/test_call_report_scaling.py \
            fee_crawler/tests/test_darwin_api.py \
            fee_crawler/tests/test_magellan_api.py \
            fee_crawler/tests/test_62b_migrations.py \
            fee_crawler/tests/test_sc4_no_sqlite.py

  # --------------------------------------------------------------------------
  # Full mode: runs e2e + llm + slow tests — makes real Anthropic API calls.
  # Triggered weekly (Sunday 04:00 UTC) and on workflow_dispatch with mode=full.
  # Requires ANTHROPIC_API_KEY secret.
  # --------------------------------------------------------------------------
  e2e-full:
    name: Runtime Regression (full)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/bfi_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r fee_crawler/requirements.txt pytest pytest-timeout

      - name: Install system dependencies for PDF extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils

      - name: Install Modal browser runtime
        run: python -m playwright install chromium

      - name: Run full runtime regression suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Explicitly unset R2_ENDPOINT so the R2 bypass guard passes
          R2_ENDPOINT: ""
        run: |
          pytest fee_crawler/tests/ -m "not e2e" \
            --timeout=600 -v --tb=short
